services:
  # =============================================================================
  # Observability
  # =============================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: kensan-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    restart: unless-stopped
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
      - "13133:13133" # Health check
    depends_on:
      - tempo
      - loki
    networks:
      - kensan-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: kensan-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - kensan-network

  loki:
    image: grafana/loki:3.3.2
    container_name: kensan-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - kensan-network

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: kensan-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=48h"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - kensan-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: kensan-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - kensan-network

  # =============================================================================
  # Infrastructure
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kensan-postgres
    environment:
      POSTGRES_USER: kensan
      POSTGRES_PASSWORD: kensan
      POSTGRES_DB: kensan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kensan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kensan-network

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: kensan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kensan
      MINIO_ROOT_PASSWORD: kensan-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - kensan-network

  minio-init:
    image: minio/mc:latest
    container_name: kensan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kensan kensan-minio &&
      mc mb --ignore-existing local/kensan-notes &&
      mc mb --ignore-existing local/kensan-lakehouse &&
      echo '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:5173\"],\"AllowedMethods\":[\"GET\",\"PUT\"],\"AllowedHeaders\":[\"*\"],\"MaxAgeSeconds\":3600}]}' | mc cors set local/kensan-notes /dev/stdin
      "
    networks:
      - kensan-network

  # =============================================================================
  # Lakehouse
  # =============================================================================
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: kensan-nessie
    ports:
      - "19120:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: IN_MEMORY
      # Quarkus config properties (using Quarkus property names directly)
      QUARKUS_PROFILE: ""
      nessie.catalog.default-warehouse: lakehouse
      nessie.catalog.warehouses.lakehouse.location: s3://kensan-lakehouse/
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000
      nessie.catalog.service.s3.default-options.external-endpoint: http://localhost:9000
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.s3
      nessie.catalog.secrets.s3.name: kensan
      nessie.catalog.secrets.s3.secret: kensan-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - kensan-network

  dremio:
    image: dremio/dremio-oss:25.2.0
    container_name: kensan-dremio
    ports:
      - "9047:9047"    # Web UI
      - "31010:31010"  # ODBC
      - "32010:32010"  # Arrow Flight SQL
    environment:
      DREMIO_JAVA_SERVER_EXTRA_OPTS: >-
        -Dpaths.dist=file:///opt/dremio/data/dist
        -Xmx4g
        -Xms2g
    volumes:
      - dremio_data:/opt/dremio/data
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - kensan-network

  # --- OpenMetadata ---
  openmetadata-postgres:
    image: docker.getcollate.io/openmetadata/postgresql:1.11.7
    container_name: kensan-openmetadata-postgres
    restart: always
    command: "--work_mem=10MB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - openmetadata_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-U", "postgres", "-tAc", "select 1", "-d", "openmetadata_db"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - kensan-network

  openmetadata-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: kensan-openmetadata-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - openmetadata_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - kensan-network

  openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:1.11.7
    container_name: kensan-openmetadata-migrate
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_HOST: openmetadata-postgres
      DB_PORT: "5432"
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      OM_DATABASE: openmetadata_db
      ELASTICSEARCH_HOST: openmetadata-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      MIGRATION_LIMIT_PARAM: "1200"
      OPENMETADATA_CLUSTER_NAME: openmetadata
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      LOG_LEVEL: INFO
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: '[http://localhost:8585/api/v1/system/config/jwks]'
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: '[admin]'
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: "false"
      AUTHORIZER_ENABLE_SECURE_SOCKET: "false"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
      PIPELINE_SERVICE_CLIENT_CLASS_NAME: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
      FERNET_KEY: jJ/9sz0g0OHxsfxOoSfdFdmk3ysNmPRnH3TUAbz3IHA=
      JWT_ISSUER: "open-metadata.org"
      JWT_KEY_ID: "Gb389a-9f76-gdjs-a92j-0242bk94356"
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      AUTHORIZER_INGESTION_PRINCIPALS: '[ingestion-bot]'
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
      SECRET_MANAGER: db
      EVENT_MONITOR: prometheus
      OPENMETADATA_HEAP_OPTS: "-Xmx1G -Xms1G"
    depends_on:
      openmetadata-postgres:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
    networks:
      - kensan-network

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:1.11.7
    container_name: kensan-openmetadata-server
    restart: always
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_HOST: openmetadata-postgres
      DB_PORT: "5432"
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      OM_DATABASE: openmetadata_db
      ELASTICSEARCH_HOST: openmetadata-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: elasticsearch
      OPENMETADATA_CLUSTER_NAME: openmetadata
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      LOG_LEVEL: INFO
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: '[http://localhost:8585/api/v1/system/config/jwks]'
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: '[admin]'
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
      AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: "false"
      AUTHORIZER_ENABLE_SECURE_SOCKET: "false"
      AUTHORIZER_INGESTION_PRINCIPALS: '[ingestion-bot]'
      AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: '["all"]'
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://openmetadata-ingestion:8080
      PIPELINE_SERVICE_CLIENT_VERIFY_SSL: "no-ssl"
      PIPELINE_SERVICE_CLIENT_CLASS_NAME: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
      PIPELINE_SERVICE_CLIENT_ENABLED: "true"
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
      FERNET_KEY: jJ/9sz0g0OHxsfxOoSfdFdmk3ysNmPRnH3TUAbz3IHA=
      JWT_ISSUER: "open-metadata.org"
      JWT_KEY_ID: "Gb389a-9f76-gdjs-a92j-0242bk94356"
      SECRET_MANAGER: db
      EVENT_MONITOR: prometheus
      OPENMETADATA_HEAP_OPTS: "-Xmx1G -Xms1G"
      MASK_PASSWORDS_API: "false"
    ports:
      - "8585:8585"
      - "8586:8586"
    depends_on:
      openmetadata-postgres:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - kensan-network

  openmetadata-ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:1.11.7
    container_name: kensan-openmetadata-ingestion
    command: airflow standalone
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: "/opt/airflow/dag_generated_configs"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_pass@openmetadata-postgres:5432/airflow_db
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - openmetadata_ingestion_dag:/opt/airflow/dag_generated_configs
      - openmetadata_ingestion_dags:/opt/airflow/dags
      - openmetadata_ingestion_tmp:/tmp
    depends_on:
      openmetadata-postgres:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_started
      openmetadata-server:
        condition: service_started
    networks:
      - kensan-network

  # =============================================================================
  # Frontend
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_USER_SERVICE_URL=http://localhost:8081
        - VITE_TASK_SERVICE_URL=http://localhost:8082
        - VITE_TIMEBLOCK_SERVICE_URL=http://localhost:8084
        - VITE_ANALYTICS_SERVICE_URL=http://localhost:8088
        - VITE_AI_SERVICE_URL=http://localhost:8089
        - VITE_MEMO_SERVICE_URL=http://localhost:8090
        - VITE_NOTE_SERVICE_URL=http://localhost:8091
    container_name: kensan-frontend
    ports:
      - "5173:5173"
    networks:
      - kensan-network

  # =============================================================================
  # Backend Services
  # =============================================================================
  user-service:
    build:
      context: ./backend
      dockerfile: services/user/Dockerfile
    container_name: kensan-user-service
    environment:
      SERVER_PORT: 8081
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kensan
      DB_PASSWORD: kensan
      DB_NAME: kensan
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      OTEL_ENABLED: "true"
      OTEL_COLLECTOR_URL: "otel-collector:4318"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kensan-network

  task-service:
    build:
      context: ./backend
      dockerfile: services/task/Dockerfile
    container_name: kensan-task-service
    environment:
      SERVER_PORT: 8082
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kensan
      DB_PASSWORD: kensan
      DB_NAME: kensan
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      OTEL_ENABLED: "true"
      OTEL_COLLECTOR_URL: "otel-collector:4318"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kensan-network

  timeblock-service:
    build:
      context: ./backend
      dockerfile: services/timeblock/Dockerfile
    container_name: kensan-timeblock-service
    environment:
      SERVER_PORT: 8084
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kensan
      DB_PASSWORD: kensan
      DB_NAME: kensan
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      OTEL_ENABLED: "true"
      OTEL_COLLECTOR_URL: "otel-collector:4318"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kensan-network

  analytics-service:
    build:
      context: ./backend
      dockerfile: services/analytics/Dockerfile
    container_name: kensan-analytics-service
    environment:
      SERVER_PORT: 8088
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kensan
      DB_PASSWORD: kensan
      DB_NAME: kensan
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      OTEL_ENABLED: "true"
      OTEL_COLLECTOR_URL: "otel-collector:4318"
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kensan-network

  ai-service:
    build:
      context: ./kensan-ai
      dockerfile: Dockerfile
    container_name: kensan-ai-service
    environment:
      SERVER_PORT: 8089
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kensan
      DB_PASSWORD: kensan
      DB_NAME: kensan
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      AI_PROVIDER: ${AI_PROVIDER:-google}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.0-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: kensan
      MINIO_SECRET_KEY: kensan-minio
      MINIO_BUCKET: kensan-notes
      MINIO_USE_SSL: "false"
      OTEL_ENABLED: "true"
      OTEL_COLLECTOR_URL: "otel-collector:4318"
      OTEL_SEMCONV_STABILITY_OPT_IN: "http"
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - kensan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  memo-service:
    build:
      context: ./backend
      dockerfile: services/memo/Dockerfile
    container_name: kensan-memo-service
    environment:
      SERVER_PORT: 8090
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kensan
      DB_PASSWORD: kensan
      DB_NAME: kensan
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      OTEL_ENABLED: "true"
      OTEL_COLLECTOR_URL: "otel-collector:4318"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kensan-network

  note-service:
    build:
      context: ./backend
      dockerfile: services/note/Dockerfile
    container_name: kensan-note-service
    environment:
      SERVER_PORT: 8091
      SERVER_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kensan
      DB_PASSWORD: kensan
      DB_NAME: kensan
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: kensan
      STORAGE_SECRET_KEY: kensan-minio
      STORAGE_BUCKET: kensan-notes
      STORAGE_USE_SSL: "false"
      STORAGE_PUBLIC_URL: http://localhost:9000/kensan-notes
      OTEL_ENABLED: "true"
      OTEL_COLLECTOR_URL: "otel-collector:4318"
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - kensan-network

networks:
  kensan-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  dremio_data:
  openmetadata_postgres_data:
  openmetadata_es_data:
  openmetadata_ingestion_dag:
  openmetadata_ingestion_dags:
  openmetadata_ingestion_tmp:
