services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: kensan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kensan
      MINIO_ROOT_PASSWORD: kensan-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lakehouse-net

  minio-init:
    image: minio/mc:latest
    container_name: kensan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kensan kensan-minio &&
      mc mb --ignore-existing local/kensan-lakehouse &&
      echo 'Lakehouse bucket ready.'
      "
    networks:
      - lakehouse-net

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: kensan-nessie
    ports:
      - "19120:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: IN_MEMORY
      QUARKUS_PROFILE: ""
      nessie.catalog.default-warehouse: lakehouse
      nessie.catalog.warehouses.lakehouse.location: s3://kensan-lakehouse/
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000
      nessie.catalog.service.s3.default-options.external-endpoint: http://localhost:9000
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.s3
      nessie.catalog.secrets.s3.name: kensan
      nessie.catalog.secrets.s3.secret: kensan-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net

  # ===== Dagster =====

  dagster-postgres:
    image: postgres:16-alpine
    container_name: kensan-dagster-postgres
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lakehouse-net

  dagster-user-code:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: kensan-dagster-user-code
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      DAGSTER_PG_URL: postgresql://dagster:dagster@dagster-postgres:5432/dagster
      DAGSTER_CURRENT_IMAGE: kensan-dagster-user-code
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dagster-postgres:
        condition: service_healthy
    networks:
      - lakehouse-net

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: kensan-dagster-webserver
    entrypoint: ["uv", "run", "dagster-webserver", "-h", "0.0.0.0", "-p", "3070", "-w", "workspace.yaml"]
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      DAGSTER_PG_URL: postgresql://dagster:dagster@dagster-postgres:5432/dagster
    ports:
      - "3070:3070"
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-user-code:
        condition: service_started
    networks:
      - lakehouse-net

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: kensan-dagster-daemon
    entrypoint: ["uv", "run", "dagster-daemon", "run"]
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      DAGSTER_PG_URL: postgresql://dagster:dagster@dagster-postgres:5432/dagster
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-user-code:
        condition: service_started
    networks:
      - lakehouse-net

networks:
  lakehouse-net:
    driver: bridge

volumes:
  minio_data:
  nessie_data:
  dagster_pg_data:
