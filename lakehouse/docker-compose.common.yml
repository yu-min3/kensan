services:
  polaris:
    image: apache/polaris:latest
    container_name: kensan-polaris
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cr3t"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: kensan
      AWS_SECRET_ACCESS_KEY: kensan-minio
    volumes:
      - ./polaris-config/application.properties:/deployments/config/application.properties:ro
      - ./polaris-config/aws-config:/root/.aws/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      dagster-postgres:
        condition: service_healthy
    networks:
      - kensan-network

  # ===== Dagster =====

  dagster-postgres:
    image: postgres:16-alpine
    container_name: kensan-dagster-postgres
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
      - ./init-polaris-db.sql:/docker-entrypoint-initdb.d/02-polaris.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - kensan-network

  dagster-user-code:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: kensan-dagster-user-code
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      DAGSTER_PG_URL: postgresql://dagster:dagster@dagster-postgres:5432/dagster
      DAGSTER_CURRENT_IMAGE: kensan-dagster-user-code
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dagster-postgres:
        condition: service_healthy
    networks:
      - kensan-network

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: kensan-dagster-webserver
    entrypoint: ["uv", "run", "dagster-webserver", "-h", "0.0.0.0", "-p", "3070", "-w", "workspace.yaml"]
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      DAGSTER_PG_URL: postgresql://dagster:dagster@dagster-postgres:5432/dagster
    ports:
      - "3070:3070"
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-user-code:
        condition: service_started
    networks:
      - kensan-network

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: kensan-dagster-daemon
    entrypoint: ["uv", "run", "dagster-daemon", "run"]
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      DAGSTER_PG_URL: postgresql://dagster:dagster@dagster-postgres:5432/dagster
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster-user-code:
        condition: service_started
    networks:
      - kensan-network

networks:
  kensan-network:
    external: true
    name: kensan-mockup_kensan-network

volumes:
  dagster_pg_data:
