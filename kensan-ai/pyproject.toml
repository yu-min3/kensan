[project]
name = "kensan-ai"
version = "0.1.0"
description = "AI agents for Kensan learning management app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kensan_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
